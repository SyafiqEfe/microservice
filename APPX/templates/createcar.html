      rel="stylesheet"
    />

  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <h1>Microservice {{ servermana }} | Car Project</h1>
          <h3>
            <a
              href="{{ request.url_for('get_service_page', service_num=servermana[-1]) }}"
              >← Back to {{ servermana }}</a
            >
          </h3>
        </div>
      </div>
      <br />
      <div class="row">
        <div class="col-md-12">
          <h4>Create Car Data for {{ servermana }}</h4>
          <!-- PERBAIKAN: Form action menunjuk ke rute FastAPI yang benar -->
          <form
            role="form"
            action="{{ request.url_for('handle_create_car_form', ms=servermana) }}"
            method="post"
          >
            <div class="form-group">
              <label for="isianName">Name</label>
              <input
                type="text"
                class="form-control"
                id="isianName"
                name="carName"
                required
              />
            </div>
            <div class="form-group">
              <label for="isianBrand">Brand</label>
              <input
                type="text"
                class="form-control"
                id="isianBrand"
                name="carBrand"
                required
              />
            </div>
            <div class="form-group">
              <label for="isianModel">Model</label>
              <input
                type="text"
                class="form-control"
                id="isianModel"
                name="carModel"
                required
              />
            </div>
            <div class="form-group">
              <label for="isianPrice">Price</label>
              <input
                type="number"
                step="0.01"
                class="form-control"
                id="isianPrice"
                name="carPrice"
                required
              />
            </div>
            <div class="form-group">
              <label for="isianDesc">Description</label>
              <input
                type="text"
                class="form-control"
                id="isianDesc"
                name="carDesc"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
      </div>
    </div>
    <script src="{{ request.url_for('static', path='/js/jquery.min.js') }}"></script>
    <script src="{{ request.url_for('static', path='/js/bootstrap.min.js') }}"></script>
