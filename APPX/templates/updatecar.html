<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Car | {{ servermana }}</title>
    <meta
      name="description"
      content="Source code generated using layoutit.com"
    />
    <meta name="author" content="LayoutIt!" />
    <link
      href="{{ request.url_for('static', path='/css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ request.url_for('static', path='/css/style.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <h1>Microservice | Car Project</h1>
          <h3>
            <a
              href="{{ request.url_for('get_service_page', service_num=servermana[-1]) }}"
              >← Back to {{ servermana }}</a
            >
          </h3>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <h4>Update Car Data in {{ servermana }}</h4>
          <!-- PERBAIKAN: Form action menunjuk ke rute update yang benar -->
          <form
            method="POST"
            action="{{ request.url_for('handle_update_car_form', ms=servermana, car_id=car.id) }}"
          >
            <div class="form-group">
              <label>Car Name</label>
              <input
                type="text"
                class="form-control"
                name="carName"
                value="{{ car.carname }}"
                required
              />
            </div>
            <div class="form-group">
              <label>Car Brand</label>
              <input
                type="text"
                class="form-control"
                name="carBrand"
                value="{{ car.carbrand }}"
                required
              />
            </div>
            <div class="form-group">
              <label>Car Model</label>
              <input
                type="text"
                class="form-control"
                name="carModel"
                value="{{ car.carmodel }}"
                required
              />
            </div>
            <div class="form-group">
              <label>Car Price</label>
              <input
                type="number"
                step="0.01"
                class="form-control"
                name="carPrice"
                value="{{ car.carprice }}"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
          </form>
        </div>
      </div>
    </div>
    <script src="{{ request.url_for('static', path='/js/jquery.min.js') }}"></script>
    <script src="{{ request.url_for('static', path='/js/bootstrap.min.js') }}"></script>
    <script src="{{ request.url_for('static', path='/js/scripts.js') }}"></script>
  </body>
</html>
